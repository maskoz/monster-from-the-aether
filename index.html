<script>
/* ── Conversion data ── */
const COLOR_VOTES = {
  W: { CON:1, WIS:1, STR:-1 },
  U: { INT:1, DEX:1, CON:-1 },
  B: { DEX:1, CHA:1, INT:-1 },
  R: { CHA:1, STR:1, DEX:-1 },
  G: { STR:1, CON:1, CHA:-1 }
};

const COLOR_RING = { W:'#c0bcb0', U:'#2864b8', B:'#585870', R:'#b02828', G:'#1a7832' };

const KEYWORD_MAP = {
  'Flying':         'Flying. MV far. Can attack and be attacked only by flying creatures or those with Reach.',
  'Deathtouch':     'Deathtouch. A single hit forces a DC [DC] CON save or the target drops to 0 HP.',
  'Trample':        'Trample. Excess damage on a killing blow carries over to a creature behind the target.',
  'Double Strike':  'Double Strike. Makes two attack rolls each round.',
  'First Strike':   'First Strike. Attacks before all other creatures; if target dies it cannot retaliate.',
  'Lifelink':       'Lifelink. Heals HP equal to all damage dealt.',
  'Vigilance':      'Vigilance. Attacking imposes no penalty to AC or saves.',
  'Haste':          'Haste. Acts on the very first round of combat, even if surprised.',
  'Reach':          'Reach. Can attack flying creatures from the ground.',
  'Indestructible': 'Indestructible. Cannot be reduced to 0 HP by damage; a special condition is required to destroy it.',
  'Menace':         'Menace. Cannot be engaged by fewer than two creatures at once.',
  'Flash':          'Flash. May act once out of initiative order per round.',
  'Hexproof':       'Hexproof. Cannot be targeted by spells or abilities; gains +4 to all magical saves.',
  'Ward':           'Ward. Targeting this creature with magic requires a DC [DC] INT save or the spell fails.',
  'Toxic':          'Toxic. Attacks inflict cumulative poison; 3 stacks deals 1d6 damage per round until cured.',
  'Fear':           'Fear. Non-undead, non-construct creatures must pass a DC [DC] WIS save or flee for 1d4 rounds.',
  'Menacing':       'Menace. Cannot be engaged by fewer than two creatures at once.',
  'Defender':       'Defender. Cannot move to attack; gains +2 AC while stationary.',
  'Banding':        'Banding. Adjacent allies may redirect received damage to this creature.',
  'Flanking':       'Flanking. Enemies without Flanking that engage it fight at −1 to all rolls.',
  'Phasing':        'Phasing. Once per round may become incorporeal, immune to physical damage until its next turn.',
  'Shadow':         'Shadow. Exists in the shadow-plane; only interacts with other shadow creatures and magic.',
  'Exalted':        'Exalted. When fighting alone (no allies nearby), gains advantage on attacks and +2 AC.',
  'Infect':         'Infect. All damage is dealt as permanent −1 stat penalties, not HP loss.',
  'Regenerate':     'Regenerate. Once per combat, when reduced to 0 HP, returns to 1 HP at the start of its next turn.',
  'Protection':     'Protection. Immune to one damage type or creature type (GM determines from card text).',
  'Annihilator':    'Annihilator. When it attacks, the target must discard [LVL÷3,min 1] items or lose an ally action.',
  'Bushido':        'Bushido. When it enters melee it gains +2 to attacks and AC for that entire encounter.',
  'Provoke':        'Provoke. Once per round can force one creature to attack it instead of another target.',
  'Rampage':        'Rampage. For each creature beyond the first that blocks it, gains +1 to attacks and damage.',
};

/* ── Stat derivation ── */
function getStatMods(colors, level) {
  const STATS = ['STR','DEX','CON','INT','WIS','CHA'];
  const t = Object.fromEntries(STATS.map(s => [s, 0]));
  (colors||[]).forEach(c => {
    const v = COLOR_VOTES[c];
    if (v) Object.entries(v).forEach(([s,n]) => { t[s] += n; });
  });

  let hi, md, lo;
  if      (level <= 2) { hi=2;  md=0;  lo=-2; }
  else if (level <= 7) { hi=4;  md=1;  lo=-2; }
  else if (level === 8){ hi=4;  md=2;  lo=-1; }
  else                 { hi=5;  md=3;  lo=1;  }

  if (!colors || colors.length === 0)
    return Object.fromEntries(STATS.map(s => [s, md]));

  const uniq = [...new Set(Object.values(t))].sort((a,b) => b-a);
  const tier = {};
  if (uniq.length === 1) { tier[uniq[0]] = md; }
  else {
    uniq.forEach((v,i) => {
      tier[v] = i === 0 ? hi : i === uniq.length-1 ? lo : md;
    });
  }
  return Object.fromEntries(STATS.map(s => [s, tier[t[s]] ?? md]));
}

function convertCard(card) {
  const level  = Math.max(1, Math.round(card.cmc || 1));
  const colors = card.colors || [];

  const rawPow  = /^\d+$/.test(card.power)     ? parseInt(card.power, 10)     : null;
  const rawTou  = /^\d+$/.test(card.toughness)  ? parseInt(card.toughness, 10) : null;

  const mods = getStatMods(colors, level);
  const dexAdj = mods.DEX >= 0 ? mods.DEX : Math.ceil(mods.DEX / 2);
  const baseTou = rawTou !== null ? rawTou : level;
  const ac = 11 + Math.ceil(baseTou / 2) + dexAdj;

  const tier = level <= 2 ? 1 : level <= 7 ? 2 : 3;
  const hp   = Math.max(1, Math.floor(4.5 * level) + mods.CON * tier);

  const atkBonus = rawPow !== null ? rawPow : Math.floor(level / 2);

  let damageDie = '1d6';
  if      (mods.STR >= 5) damageDie = '1d12';
  else if (mods.STR >= 4) damageDie = '1d10';
  else if (mods.STR >= 2) damageDie = '1d8';
  else if (mods.STR <= -2) damageDie = '1d4';

  const keywords = card.keywords || [];
  let mv = 'near';
  if (keywords.includes('Flying')) mv = 'near (fly)';

  const hasW = colors.includes('W'), hasB = colors.includes('B');
  const align = hasW && !hasB ? 'L' : hasB && !hasW ? 'C' : 'N';

  const dc = 10 + Math.floor(level / 2);

  const abilities = keywords
    .filter(k => KEYWORD_MAP[k])
    .map(k => KEYWORD_MAP[k]
      .replace(/\[DC\]/g, dc)
      .replace(/\[LVL÷3,min 1\]/g, Math.max(1, Math.floor(level/3))));

  const fm = n => n >= 0 ? `+${n}` : `${n}`;
  const statLine =
    `AC ${ac}, HP ${hp}, ATK ${fm(atkBonus)} (${damageDie}), MV ${mv}, ` +
    `S ${fm(mods.STR)}, D ${fm(mods.DEX)}, C ${fm(mods.CON)}, ` +
    `I ${fm(mods.INT)}, W ${fm(mods.WIS)}, Ch ${fm(mods.CHA)}, AL ${align}, LV ${level}`;

  return { name:card.name, typeLine:card.type_line, level, ac, hp, atkBonus, damageDie,
           mv, mods, align, abilities, statLine, colors,
           oracleText: card.oracle_text || '', flavorText: card.flavor_text || '' };
}

/* ── Scryfall fetch ── */
function buildUrl() {
  const name  = document.getElementById('nameInput').value.trim();
  const color = document.getElementById('selColor').value;
  const cost  = document.getElementById('selCost').value;
  if (name) return `https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(name)}`;
  let q = 'type:creature -type:land';
  if (color === 'M') q += ' is:multicolor';
  else if (color === 'C') q += ' color:C';
  else if (color) q += ` color<=${color}`;
  if (cost === '7p') q += ' cmc>=7';
  else if (cost) q += ` cmc=${cost}`;
  return `https://api.scryfall.com/cards/random?q=${encodeURIComponent(q)}`;
}

function getImgs(card) {
  if (card.image_uris) return card.image_uris;
  if (card.card_faces?.[0]?.image_uris) return card.card_faces[0].image_uris;
  return null;
}

/* ── Canvas token ── */
async function drawTokenToCanvas(canvas, artUrl, colors) {
  const ctx  = canvas.getContext('2d');
  const size = canvas.width;
  ctx.clearRect(0, 0, size, size);

  let ringColor = '#909098';
  if (colors.length >= 2) ringColor = '#c9a227';
  else if (colors.length === 1) ringColor = COLOR_RING[colors[0]] || ringColor;

  const pad = Math.max(4, Math.round(size * 0.03));
  const r   = size / 2 - pad;
  const cx  = size / 2, cy = size / 2;

  const img = new Image();
  img.crossOrigin = 'anonymous';

  await new Promise(resolve => {
    img.onload = () => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.clip();
      const sc = Math.max((r*2)/img.width, (r*2)/img.height);
      const w = img.width*sc, h = img.height*sc;
      ctx.drawImage(img, cx - w/2, cy - h/2, w, h);
      ctx.restore();
      resolve();
    };
    img.onerror = () => {
      ctx.fillStyle = '#2a1e18';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();
      resolve();
    };
    img.src = artUrl;
  });

  /* inner shadow ring */
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = pad * 0.6;
  ctx.stroke();

  /* color ring */
  ctx.beginPath();
  ctx.arc(cx, cy, r + pad * 0.3, 0, Math.PI*2);
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = pad * 0.9;
  ctx.stroke();

  /* outer dark edge */
  ctx.beginPath();
  ctx.arc(cx, cy, r + pad * 0.8, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  ctx.lineWidth = pad * 0.35;
  ctx.stroke();
}

/* ── Render ── */
let curCard = null, curMonster = null;

async function renderResult(card, monster) {
  const imgs = getImgs(card);

  /* art */
  const artImg  = document.getElementById('artImg');
  const artPH   = document.getElementById('artPlaceholder');
  artImg.style.opacity = '0';
  artPH.hidden = false;

  if (imgs?.art_crop) {
    await new Promise(resolve => {
      artImg.onload  = () => { artImg.style.opacity='1'; artPH.hidden=true; resolve(); };
      artImg.onerror = () => { artPH.textContent='Art unavailable.'; resolve(); };
      artImg.src = imgs.art_crop;
    });
  } else { artPH.textContent = 'No art.'; }

  const thumb = document.getElementById('cardThumb');
  if (imgs?.normal) { thumb.src = imgs.normal; thumb.hidden = false; }
  else thumb.hidden = true;

  /* meta */
  document.getElementById('metaName').textContent = card.name;
  document.getElementById('metaType').textContent = card.type_line;
  const set = card.set_name || card.set?.toUpperCase() || '';
  const rar = card.rarity ? card.rarity[0].toUpperCase()+card.rarity.slice(1) : '';
  const art = card.artist ? `Art: ${card.artist}` : '';
  document.getElementById('metaSet').textContent = [set, rar, art].filter(Boolean).join(' · ');

  /* monster block */
  document.getElementById('monName').textContent  = monster.name;
  document.getElementById('monType').textContent  = monster.typeLine;
  document.getElementById('statLine').textContent = monster.statLine;

  const ul = document.getElementById('abilityList');
  ul.innerHTML = '';
  monster.abilities.forEach(ab => {
    const li = document.createElement('li');
    li.className = 'ability-item';
    li.textContent = ab;
    ul.appendChild(li);
  });

  const ob = document.getElementById('oracleBlock');
  if (monster.oracleText) { ob.textContent = monster.oracleText; ob.hidden = false; }
  else ob.hidden = true;

  const fb = document.getElementById('flavorBlock');
  if (monster.flavorText) { fb.textContent = `"${monster.flavorText}"`; fb.hidden = false; }
  else fb.hidden = true;

  /* token */
  if (imgs?.art_crop) {
    await drawTokenToCanvas(document.getElementById('tokenCanvas'), imgs.art_crop, monster.colors);
  }
}

async function fetchCard() {
  const btn = document.getElementById('drawBtn');
  const sm  = document.getElementById('statusMsg');
  const em  = document.getElementById('errorMsg');
  const rg  = document.getElementById('resultGrid');

  btn.disabled = true;
  em.hidden = true;
  sm.textContent = 'Reaching into the Blind Eternities…';
  sm.hidden = false;
  rg.hidden = true;

  try {
    const url = buildUrl();
    const res = await fetch(url, { headers: { Accept:'application/json' } });
    if (!res.ok) {
      if (res.status === 404) throw new Error('Card not found. Try a different name.');
      const body = await res.json().catch(() => ({}));
      throw new Error(body.details || `Scryfall returned ${res.status}.`);
    }
    const card = await res.json();
    if (!card.type_line?.includes('Creature')) throw new Error(`"${card.name}" is not a creature. Try again.`);

    curCard    = card;
    curMonster = convertCard(card);
    await renderResult(card, curMonster);

    sm.hidden = true;
    rg.hidden = false;
  } catch(e) {
    sm.hidden = true;
    em.textContent = e.message;
    em.hidden = false;
  } finally {
    btn.disabled = false;
  }
}

async function downloadToken() {
  if (!curCard || !curMonster) return;
  const imgs = getImgs(curCard);
  if (!imgs?.art_crop) return;

  const c = document.createElement('canvas');
  c.width = c.height = 512;
  await drawTokenToCanvas(c, imgs.art_crop, curMonster.colors);

  c.toBlob(blob => {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: curMonster.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-token.png'
    });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

function copyStats() {
  if (!curMonster) return;
  const lines = [
    curMonster.name,
    curMonster.typeLine,
    '',
    curMonster.statLine,
  ];
  if (curMonster.abilities.length) { lines.push(''); lines.push(...curMonster.abilities); }
  if (curMonster.flavorText) { lines.push(''); lines.push(`"${curMonster.flavorText}"`); }

  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const t = document.getElementById('toast');
    t.textContent = 'Copied to clipboard.';
    setTimeout(() => { t.textContent = ''; }, 2000);
  }).catch(() => {
    const t = document.getElementById('toast');
    t.textContent = 'Copy failed — try manually.';
  });
}

document.getElementById('drawBtn').addEventListener('click', fetchCard);
document.getElementById('dlBtn').addEventListener('click', downloadToken);
document.getElementById('fvttBtn').addEventListener('click', downloadFoundryJSON);
document.getElementById('copyBtn').addEventListener('click', copyStats);

/* ── Foundry VTT JSON export ── */
function fvttId() {
  const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from({length:16}, () => c[Math.floor(Math.random()*c.length)]).join('');
}

function fvttStats() {
  const now = Date.now();
  return {
    compendiumSource: null, duplicateSource: null, exportSource: null,
    coreVersion: '14.364', systemId: 'shadowdark', systemVersion: '4.0.6',
    lastModifiedBy: null, createdTime: now, modifiedTime: now
  };
}

function buildNotesHtml(card, monster) {
  const fm = n => n >= 0 ? `+${n}` : `${n}`;
  let html = `<p><strong>AC</strong> ${monster.ac}, <strong>HP</strong> ${monster.hp}, `
    + `<strong>ATK</strong> ${fm(monster.atkBonus)} (${monster.damageDie}), `
    + `<strong>MV</strong> ${monster.mv}, `
    + `<strong>S</strong> ${fm(monster.mods.STR)}, <strong>D</strong> ${fm(monster.mods.DEX)}, `
    + `<strong>C</strong> ${fm(monster.mods.CON)}, <strong>I</strong> ${fm(monster.mods.INT)}, `
    + `<strong>W</strong> ${fm(monster.mods.WIS)}, <strong>Ch</strong> ${fm(monster.mods.CHA)}, `
    + `<strong>AL</strong> ${monster.align}, <strong>LV</strong> ${monster.level}</p>`;
  monster.abilities.forEach(ab => {
    const dot = ab.indexOf('.');
    if (dot > -1) html += `<p><strong>${ab.slice(0,dot)}</strong>.${ab.slice(dot+1)}</p>`;
    else html += `<p>${ab}</p>`;
  });
  if (monster.oracleText) html += `<p><em>${monster.oracleText.replace(/\n/g,'<br>')}</em></p>`;
  if (monster.flavorText) html += `<p><em>"${monster.flavorText}"</em></p>`;
  html += `<p><em>Source: ${card.name} — ${card.type_line} (${card.set_name || card.set?.toUpperCase()})</em></p>`;
  return html;
}

function generateFoundryJSON(card, monster) {
  const imgs = getImgs(card);
  const imgUrl = imgs?.art_crop || 'icons/svg/mystery-man.svg';

  const alignMap = { L:'lawful', N:'neutral', C:'chaotic' };
  const alignment = alignMap[monster.align] || 'neutral';

  const mvParts = monster.mv.split(' ');
  const move = mvParts[0];
  const moveNote = mvParts.slice(1).join(' ').replace(/[()]/g,'').trim();

  const diceMatch = monster.damageDie.match(/(\d+)d(\d+)/);
  const numDice = diceMatch ? parseInt(diceMatch[1]) : 1;

  const items = [];

  // Attack
  items.push({
    _id: fvttId(), effects: [], folder: null,
    img: 'icons/svg/sword.svg',
    name: 'Attack',
    system: {
      description: '', source: { title: '' },
      attack: { num: 1 },
      bonuses: {
        attackBonus: monster.atkBonus,
        critical: { failureThreshold: 1, multiplier: 2, successThreshold: 20 },
        damageBonus: 0
      },
      damage: { numDice, special: '', value: monster.damageDie },
      ranges: ['close'], properties: []
    },
    type: 'NPC Attack', _stats: fvttStats(), sort: 0, flags: {}, ownership: { default: 0 }
  });

  // Features (one per ability)
  monster.abilities.forEach((ab, i) => {
    const dot = ab.indexOf('.');
    const name = dot > -1 ? ab.slice(0, dot) : ab;
    const desc = dot > -1 ? ab.slice(dot+1).trim() : '';
    items.push({
      _id: fvttId(), effects: [], folder: null,
      img: 'icons/creatures/abilities/dragon-breath-purple.webp',
      name,
      system: { description: desc ? `<p>${desc}</p>` : '', source: { title: '' }, properties: [] },
      type: 'NPC Feature', _stats: fvttStats(), sort: (i+1)*100, flags: {}, ownership: { default: 0 }
    });
  });

  const prototypeToken = {
    actorLink: false, alpha: 1, appendNumber: false,
    bar1: { attribute: null }, bar2: { attribute: null },
    detectionModes: {}, displayBars: 0, displayName: 0, disposition: -1,
    flags: {}, height: 1,
    light: {
      alpha: 0.5, angle: 360,
      animation: { intensity: 5, reverse: false, speed: 5, type: null },
      attenuation: 0.5, bright: 0, color: null, coloration: 1, contrast: 0,
      darkness: { max: 1, min: 0 }, dim: 0, luminosity: 0.5,
      negative: false, priority: 0, saturation: 0, shadows: 0
    },
    lockRotation: false, movementAction: null, name: monster.name,
    occludable: { radius: 0 }, prependAdjective: false, randomImg: false,
    ring: { colors: { background: null, ring: null }, effects: 1, enabled: false, subject: { scale: 1, texture: null } },
    rotation: 0,
    sight: { angle: 360, attenuation: 0.1, brightness: 0, color: null, contrast: 0, enabled: false, range: 100, saturation: 0, visionMode: 'basic' },
    texture: { alphaThreshold: 0.75, anchorX: 0.5, anchorY: 0.5, fit: 'contain', scaleX: 1, scaleY: 1, src: imgUrl, tint: '#ffffff' },
    turnMarker: { animation: null, disposition: false, mode: 1, src: null },
    width: 1, depth: 1
  };

  return {
    effects: [], folder: null,
    img: imgUrl,
    items,
    name: monster.name,
    prototypeToken,
    system: {
      alignment,
      attributes: {
        ac: { value: monster.ac },
        hp: { max: monster.hp, value: monster.hp }
      },
      level: { value: monster.level, xp: 0 },
      notes: buildNotesHtml(card, monster),
      abilities: {
        str: { mod: monster.mods.STR }, int: { mod: monster.mods.INT },
        dex: { mod: monster.mods.DEX }, wis: { mod: monster.mods.WIS },
        con: { mod: monster.mods.CON }, cha: { mod: monster.mods.CHA }
      },
      darkAdapted: false,
      move,
      moveNote,
      spellcasting: { ability: '', bonus: 0, attacks: 0 }
    },
    type: 'NPC',
    _stats: fvttStats(),
    flags: {},
    ownership: { default: 0 }
  };
}

function downloadFoundryJSON() {
  if (!curCard || !curMonster) return;
  const data = generateFoundryJSON(curCard, curMonster);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `fvtt-Actor-${curMonster.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchCard();
});
</script>
